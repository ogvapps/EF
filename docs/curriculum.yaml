# =============================================================================
# CURRÍCULO COMPLETO EF App — Datos estructurados listos para Firestore
# 1º-4º ESO · LOMLOE · Extremadura
# =============================================================================
# Formato: YAML
# Uso:  importar a Firestore mediante script (seed)
# =============================================================================

meta:
  version: "1.0.0"
  created: "2026-05-28"
  curriculum: "LOMLOE Extremadura"
  app_name: "EF Quest"

# =============================================================================
# CONFIGURACIÓN GLOBAL DE GAMIFICACIÓN
# =============================================================================
gamification:
  xp_per_level: 500
  max_level: 100
  max_attributes: 100

  # XP values base
  xp:
    lesson_complete: 25
    quiz_perfect: 50
    challenge_pass: 50
    challenge_3stars: 100
    minigame_pass: 30
    minigame_perfect: 60
    boss_pass: 150
    boss_perfect: 300
    daily_streak_bonus: 10
    weekly_streak_bonus: 100

  # Monedas
  coins:
    lesson: 5
    challenge: 10
    minigame: 8
    boss: 25
    streak_day: 2

  # Rangos (tiers de avatar)
  tiers:
    rookie:
      min_level: 0
      min_xp: 0
    amateur:
      min_level: 10
      min_xp: 5000
    competidor:
      min_level: 25
      min_xp: 12500
    capitan:
      min_level: 45
      min_xp: 22500
    elite:
      min_level: 70
      min_xp: 35000

  # Atributos
  attributes:
    fuerza:
      icon: "💪"
      color: "#FF4444"
    resistencia:
      icon: "❤️"
      color: "#FF6B35"
    estrategia:
      icon: "🧠"
      color: "#4A90D9"
    cooperacion:
      icon: "🤝"
      color: "#50C878"
    salud:
      icon: "🍎"
      color: "#32CD32"
    liderazgo:
      icon: "⭐"
      color: "#FFD700"

# =============================================================================
# CURSOS
# =============================================================================
courses:

  # ===========================================================================
  # 1º ESO
  # ===========================================================================
  1_eso:
    name: "1º ESO"
    short: "1ESO"
    objective: "Adaptación a la Educación Física de secundaria, desarrollo motor básico y creación de hábitos saludables."
