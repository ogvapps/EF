        units:

          # ── UD1 ──
          - id: "1eso_ud1"
            order: 1
            title: "Bienvenido a tu cuerpo"
            weeks: 3
            color: "#4CAF50"
            icon: "🏃"
            saber_basico:
              - "condición física básica"
              - "higiene"
              - "calentamiento"
              - "frecuencia cardíaca"
              - "hábitos saludables"
            competencias:
              - "CE1: Adoptar hábitos saludables"
              - "CE2: Conocer el cuerpo y sus respuestas"
              - "CE5: Autorregular emociones"
            attribute_focus:
              fuerza: 1
              resistencia: 2
              estrategia: 1
              cooperacion: 2
              salud: 5
              liderazgo: 1
            boss_name: "El Sedentarismo"
            total_xp: 520
            required_xp: 300

            lessons:
              - id: "1eso_ud1_l01"
                order: 1
                title: "¿Qué es la actividad física?"
                type: "video"
                duration_sec: 60
                xp: 25
                coins: 5
                video_url: "lessons/1eso_ud1_l01.mp4"
                summary: "Diferencia entre ejercicio, deporte y actividad física. Beneficios para cuerpo y mente."

              - id: "1eso_ud1_l02"
                order: 2
                title: "Tu cuerpo en movimiento"
                type: "reading"
                duration_sec: 90
                xp: 25
                coins: 5
                content: "Conoce los principales sistemas: muscular, óseo, cardiovascular. ¿Qué pasa cuando te mueves?"

              - id: "1eso_ud1_l03"
                order: 3
                title: "Midiendo tu motor"
                type: "quiz"
                duration_sec: 60
                xp: 35
                coins: 5
                quiz:
                  min_pass: 70
                  questions:
                    - q: "¿Qué es la frecuencia cardíaca?"
                      options: ["Las veces que respiras por minuto", "Las veces que el corazón late por minuto", "La temperatura del cuerpo", "La cantidad de sudor"]
                      correct: 1
                    - q: "¿Cuál es un beneficio de la actividad física?"
                      options: ["Aumenta el estrés", "Mejora el sueño y el ánimo", "Reduce la fuerza", "Aumenta el cansancio extremo"]
                      correct: 1
                    - q: "¿Cuándo debes hacer un calentamiento?"
                      options: ["Después del ejercicio", "Antes del ejercicio", "Solo si hace frío", "Nunca"]
                      correct: 1
                    - q: "¿Qué pulso se considera reposo normal?"
                      options: ["120-140 lpm", "60-100 lpm", "0-30 lpm", "150-180 lpm"]
                      correct: 1

              - id: "1eso_ud1_l04"
                order: 4
                title: "Hábitos que suman"
                type: "flashcard"
                duration_sec: 90
                xp: 25
                coins: 5
                cards:
                  - front: "¿Cuántas horas de sueño necesita un adolescente?"
                    back: "8-10 horas diarias"
                  - front: "¿Cada cuánto deberías beber agua haciendo ejercicio?"
                    back: "Cada 15-20 minutos"
                  - front: "¿Qué es el sedentarismo?"
                    back: "Estar sentado más de 2h seguidas sin movimiento"
                  - front: "¿Cuántos pasos diarios se recomiendan?"
                    back: "Al menos 8.000-10.000 pasos"

            challenges:
              - id: "1eso_ud1_c01"
                order: 1
                title: "Toma de pulsaciones"
                type: "heart_rate"
                difficulty: "facil"
                goal_type: "seconds"
                goal_value: 60
                min_value: 30
                max_value: 120
                xp: 50
                coins: 10
                intro: "Encuentra tu pulso en la muñeca o el cuello. Cuenta los latidos durante 15 segundos y multiplica por 4."

              - id: "1eso_ud1_c02"
                order: 2
                title: "Calentamiento exprés"
                type: "mobility"
                difficulty: "facil"
                goal_type: "reps"
                goal_value: 8
                min_value: 5
                max_value: 12
                xp: 50
                coins: 10
                intro: "Realiza 8 ejercicios de movilidad articular: cuello, hombros, muñecas, cadera, rodillas, tobillos."

              - id: "1eso_ud1_c03"
                order: 3
                title: "6000 pasos"
                type: "steps"
                difficulty: "medio"
                goal_type: "steps"
                goal_value: 6000
                min_value: 4000
                max_value: 10000
                xp: 75
                coins: 15
                intro: "Camina durante el día hasta alcanzar 6000 pasos. Tu contador lo registra automáticamente."

