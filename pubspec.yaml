name: ef_app
description: App gamificada de Educación Física (LOMLOE Extremadura)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.3.0

  go_router: ^13.0.0
  flutter_riverpod: ^2.4.9

  flutter_secure_storage: ^9.0.0

  fl_chart: ^0.66.0
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  google_fonts: ^6.1.0
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_1024.png"
  adaptive_icon_background: "#1A1040"
  adaptive_icon_foreground: "assets/icons/icon_1024.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
    # - assets/fonts/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
